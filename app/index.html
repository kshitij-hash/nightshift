<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/src/assets/fonts/geist-mono-latin-400-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>NIGHTSHIFT · private subscriptions on Starknet</title>
    <meta
      name="description"
      content="Private subscriptions on Starknet mainnet. Fund one once through the STRK20 privacy pool; a vault charges it on schedule, with no wallet on file."
    />
    <meta property="og:title" content="NIGHTSHIFT · private subscriptions on Starknet" />
    <meta
      property="og:description"
      content="Fund a subscription once through the STRK20 privacy pool; a vault charges it on schedule, with no wallet on file. Live on mainnet."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Theme before first paint, so nothing flashes. Light is the default:
      // only an explicitly stored choice, or a stored "system", consults the
      // operating system. Keep this rule in step with src/theme/theme-provider.
      (function () {
        try {
          var stored = window.localStorage.getItem("nightshift-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : stored === "system"
                ? window.matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark"
                : "light";
          if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
