<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="preload"
      href="/src/assets/fonts/bricolage-latin-400-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/archivo-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/spacemono-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>NIGHTSHIFT · Back anyone. Show no one.</title>
    <meta
      name="description"
      content="Private fan subscriptions. Support the creators you love week after week; your name, your wallet and your history stay yours. Cancel in one tap."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://nightshiftxyz.vercel.app/" />
    <meta name="theme-color" content="#0e0c11" />
    <meta property="og:site_name" content="NIGHTSHIFT" />
    <meta property="og:title" content="NIGHTSHIFT · Back anyone. Show no one." />
    <meta
      property="og:description"
      content="Private fan subscriptions. Support the creators you love week after week; your name, your wallet and your history stay yours. Cancel in one tap."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nightshiftxyz.vercel.app/" />
    <meta property="og:image" content="https://nightshiftxyz.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /* The theme is decided before the bundle arrives, so the first frame is
         already the right ground. Dark is the default; Daybreak is a choice. */
      try {
        if (localStorage.getItem("nightshift.theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    </script>
    <style>
      html { background: #0e0c11; color-scheme: dark; }
      html[data-theme="light"] { background: #f5f0ea; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; max-width: 60ch; color: #f4eff2">
        NIGHTSHIFT is private fan subscriptions. The app talks to the network
        from your browser, so it needs JavaScript enabled. The source is at
        https://github.com/kshitij-hash/nightshift.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
