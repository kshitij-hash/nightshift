name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-manifest.mjs

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Root install serves verify/, preflight/ and the scripts/ tests, which
      # resolve starknet by walking up to the root node_modules. The example
      # and the site carry their own lockfiles and install separately.
      - run: npm ci --ignore-scripts
      - run: cd verify && node --test
      - run: cd preflight && node --test
      - run: cd examples/telegram-gate && npm ci --ignore-scripts && node --test
      - run: node --test 'demo-charge/test/*.test.mjs'
      - run: node --test scripts/creator-metrics.test.mjs
      - run: node --test scripts/present-message-compat.test.mjs
      # Drift gate: the generator writes site/src/lib/selectors.ts only when
      # its output differs, so a dirty tree here means a selector changed
      # without the committed file following it.
      - run: node scripts/gen-selectors.mjs && git diff --exit-code site/src/lib/selectors.ts
      - run: cd site && npm ci --ignore-scripts && npx tsc --noEmit

  cairo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same toolchain the vault was built and deployed with — CI must never
      # build a different tree than the one shipped from the workstation.
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.17.0"
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.59.0"
      # The privacy dependency is a git workspace whose resolution clones
      # several public repos. Anonymous clones from shared runner IPs get
      # rate-limited, which git surfaces as exit 128 inside scarb. Route the
      # clones through the workflow token instead.
      - run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # The privacy workspace names starkware-starknet-utils from two members,
      # and scarb races itself cloning the same cache directory when it is
      # cold ("failed to remove directory ... No such file or directory").
      # A retried fetch warms the cache; the race cannot recur on a warm one.
      - run: scarb fetch || scarb fetch || scarb fetch
      - run: scarb build
      - run: snforge test
